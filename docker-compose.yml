# Local equivalent of the production container. Run with:
#   docker compose up --build
# then open http://localhost:3002 (matching `npm run dev`'s port).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3002:3000'
    environment:
      # Read from your shell or a sibling .env file; never baked into the
      # image (see .dockerignore).
      CLOUDIQ_API_KEY: ${CLOUDIQ_API_KEY:-}
      CLOUDIQ_BASE_URL: ${CLOUDIQ_BASE_URL:-https://REDACTED-GATEWAY-HOST}
      CLOUDIQ_MODEL: ${CLOUDIQ_MODEL:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      HONEYPOT_AWS_ACCESS_KEY_ID: ${HONEYPOT_AWS_ACCESS_KEY_ID:-}
      HONEYPOT_AWS_SECRET_ACCESS_KEY: ${HONEYPOT_AWS_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
